name: Daily modal queries
on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      num_questions:
        description: "Number of questions to generate for this manual run"
        required: false
        default: "100"

jobs:
  run-queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version-file: ".python-version"

      - name: Install dependencies with uv
        run: uv pip install -r requirements.txt --system

      - name: Run queries
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_USE_GATEWAY: "true"
          BRAINTRUST_GATEWAY_URL: https://gateway.braintrust.dev/v1
          BRAINTRUST_PROJECT: google-adk-supervisor
          BRAINTRUST_PROJECT_ID: 8c192115-ff7f-4095-8464-5ac8ecd50ae1
          BRAINTRUST_ORG_NAME: Braintrust Demos
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NUM_QUESTIONS: ${{ github.event.inputs.num_questions || '100' }}
          MODEL_POOL: gpt-4o-mini
          QUESTION_GENERATOR_MODEL: gpt-4o-mini
          CONCURRENCY: 1
          MAX_RETRIES: 3
          BASE_RETRY_SECONDS: 15
          INTER_QUESTION_DELAY_SECONDS: 2
          TRACE_PROFILE: full
        run: |
          uv run python scripts/run_queries.py --num-questions "$NUM_QUESTIONS" --fail-on-error
